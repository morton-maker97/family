<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Archive</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:#3B1F0F;color:#fff;min-height:100vh;}
button{border-radius:0!important;cursor:pointer;font-family:Georgia,serif;}

/* ── NAV ── */
#nav{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:48px;background:#2A1508;border-bottom:1px solid #5a3520;position:sticky;top:0;z-index:100;}
.nav-brand{font-size:15px;font-weight:500;color:#fff;letter-spacing:.03em;}
.nav-links{display:flex;gap:8px;align-items:center;}
.nav-btn{font-size:12px;background:none;border:1px solid #5a3520;color:#fff;padding:6px 16px;}
.nav-btn:hover{background:#FA8072;color:#14451e;border-color:#FA8072;}

/* ── TOOLBAR ── */
#toolbar{display:flex;align-items:center;gap:12px;padding:8px 20px;background:#2A1508;border-bottom:1px solid #5a3520;}
#toolbar span{font-size:12px;color:#fff;min-width:38px;text-align:center;}
.zoom-btn{width:28px;height:28px;border:1px solid #5a3520;background:#3B1F0F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;}
.zoom-btn:hover{background:#FA8072;color:#14451e;border-color:#FA8072;}
.hint-txt{font-size:11px;color:#c8a882;margin-left:4px;}

/* ── TREE CANVAS ── */
#canvas-wrap{overflow:auto;width:100%;height:calc(100vh - 96px);background:#3B1F0F;position:relative;}
#canvas{position:relative;transform-origin:top left;transition:transform .3s ease;padding:20px 40px 60px;}
svg.connectors{position:absolute;top:0;left:0;pointer-events:none;}
#load-status{padding:40px;font-size:13px;color:#c8a882;}

.node{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.node-photo{border:1px solid #fff;background:#2A1508;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;transition:border-color .2s,transform .15s;color:#fff;width:52px;height:72px;}
.node:hover .node-photo{border-color:#FA8072;transform:scale(1.06);}
.node-name{font-size:10px;color:#fff;margin-top:6px;text-align:center;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.node-photo img,#root-photo img,.grid-card-img img,#detail-photo-wrap img{width:100%;height:100%;object-fit:cover;}

/* ── ROOT ROW ── */
#root-row{position:absolute;display:flex;align-items:center;gap:18px;}
#root-photo{width:160px;height:100px;border:1px solid #fff;background:#2A1508;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;flex-shrink:0;transition:border-color .2s;color:#fff;overflow:hidden;}
#root-photo:hover{border-color:#FA8072;}
#root-name-label{font-size:12px;font-weight:500;color:#fff;margin-bottom:5px;}
#root-quote{font-size:12px;font-style:italic;color:#c8a882;line-height:1.5;border-left:2px solid #fff;padding-left:8px;max-width:180px;}
#root-quote.editable{cursor:pointer;}
#root-quote.editable:hover{color:#fff;}

/* ── GRID VIEW ── */
#grid-view{display:none;overflow-y:auto;height:calc(100vh - 96px);padding:24px;background:#3B1F0F;}
.grid-inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
.grid-card{cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:10px 6px;background:#2A1508;border:1px solid #5a3520;transition:border-color .15s;}
.grid-card:hover{border-color:#FA8072;}
.grid-card-img{width:100%;height:90px;background:#3B1F0F;border:1px solid #5a3520;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;overflow:hidden;}
.grid-card-name{font-size:11px;color:#fff;margin-top:7px;text-align:center;}

/* ── ABOUT PAGE ── */
#about-page{display:none;overflow-y:auto;height:calc(100vh - 48px);background:#3B1F0F;padding:40px 48px;}
.about-back{display:flex;align-items:center;gap:6px;font-size:13px;color:#c8a882;background:none;border:none;padding:0;margin-bottom:32px;}
.about-back:hover{color:#FA8072;}
.about-title{font-size:22px;font-weight:500;color:#fff;margin-bottom:20px;}
.about-body{font-size:14px;color:#c8a882;line-height:1.8;margin-bottom:24px;white-space:pre-wrap;max-width:640px;}
.about-textarea{display:none;width:100%;max-width:640px;min-height:160px;background:#2A1508;border:1px solid #5a3520;color:#fff;padding:12px;font-size:14px;font-family:Georgia,serif;line-height:1.8;margin-bottom:16px;resize:vertical;}

/* ── DETAIL PANEL (PROFILE SIDEBAR) ── */
#detail-panel{position:fixed;top:0;left:-380px;width:350px;height:100%;background:#2A1508;border-right:1px solid #5a3520;z-index:200;display:flex;flex-direction:column;transition:left .38s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
#detail-panel.open{left:0;}
.dp-inner{padding:20px 18px;display:flex;flex-direction:column;gap:12px;}
.back-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:#fff;background:none;border:none;padding:0;}
.back-btn:hover{color:#FA8072;}
#detail-photo-wrap{width:100%;height:200px;background:#3B1F0F;border:1px solid #fff;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;overflow:hidden;}
#detail-name{font-size:17px;font-weight:500;color:#fff;}
#detail-rel{font-size:12px;color:#c8a882;}
.dp-btn{font-size:12px;padding:8px 16px;border:1px solid #fff;background:#3B1F0F;color:#fff;margin-right:8px;}
.dp-btn:hover{background:#FA8072;color:#14451e;border-color:#FA8072;}
.dp-textarea{width:100%;min-height:64px;border:1px solid #5a3520;padding:8px;font-size:12px;resize:vertical;background:#3B1F0F;color:#fff;font-family:Georgia,serif;}
.dp-divider{height:1px;background:#5a3520;margin:4px 0;}
.dp-label{font-size:10px;color:#c8a882;letter-spacing:.05em;margin-bottom:4px;}
#sources-list{display:flex;flex-direction:column;gap:5px;}
.src-item{display:flex;align-items:flex-start;gap:5px;font-size:11px;color:#c8a882;line-height:1.5;}
.src-num{color:#8a6040;min-width:14px;}
.src-del{background:none;border:none;color:#5a3520;font-size:13px;margin-left:auto;padding:0 2px;cursor:pointer;}
.src-del:hover{color:#FA8072;}
#person-edit-fields{display:none;flex-direction:column;gap:2px;margin-bottom:8px;}
#person-edit-fields .ov-input{margin-bottom:8px;}

/* ── BREADCRUMB ── */
#breadcrumb-bar{display:none;flex-wrap:wrap;align-items:center;gap:0;padding:8px 0 4px;border-bottom:1px solid #5a3520;font-size:11px;color:#8a6040;}
#breadcrumb-bar.visible{display:flex;}
.bc-item{display:flex;align-items:center;}
.bc-link{color:#c8a882;cursor:pointer;padding:1px 3px;background:none;border:none;font-size:11px;font-family:Georgia,serif;text-decoration:underline;text-underline-offset:2px;}
.bc-link:hover{color:#FA8072;}
.bc-current{color:#fff;font-weight:500;padding:1px 3px;}
.bc-sep{color:#5a3520;margin:0 1px;font-size:11px;user-select:none;}

/* ── CONTACT / QUOTE / LOGIN / MESSAGES OVERLAY ── */
#overlay-panel{display:none;position:fixed;inset:0;z-index:300;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
#overlay-panel.open{display:flex;}
#overlay-bg{position:fixed;inset:0;background:rgba(20,8,2,.85);}
#overlay-box{position:relative;background:#2A1508;border:1px solid #5a3520;padding:28px;width:400px;max-width:96vw;z-index:2;}
#overlay-box h3{font-size:15px;color:#fff;margin-bottom:16px;}

.ov-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid #5a3520;}
.ov-tab{font-size:12px;padding:7px 0;background:none;border:none;border-bottom:2px solid transparent;color:#c8a882;}
.ov-tab.active{color:#fff;border-bottom:2px solid #fff;}
.ov-tab:hover{color:#FA8072;}
.ov-tab:first-child{margin-right:24px;}

.ov-field{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;}
.ov-field label{font-size:12px;color:#fff;}
.ov-input{width:100%;border:1px solid #5a3520;background:#3B1F0F;color:#fff;padding:8px 10px;font-size:12px;font-family:Georgia,serif;}
.ov-input:focus{border-color:#c8a882;outline:none;}
.ov-textarea{width:100%;border:1px solid #5a3520;background:#3B1F0F;color:#fff;padding:8px 10px;font-size:12px;font-family:Georgia,serif;min-height:80px;resize:vertical;}
.ov-textarea:focus{border-color:#c8a882;outline:none;}

.desc-text-block{font-size:13px;color:#c8a882;line-height:1.7;margin-bottom:8px;white-space:pre-wrap;}
.desc-edit-inline-btn{font-size:11px;padding:5px 10px;border:1px solid #5a3520;background:none;color:#c8a882;}
.desc-edit-inline-btn:hover{color:#FA8072;border-color:#FA8072;}

.ov-btn-row{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
.ov-close{font-size:12px;padding:8px 20px;border:1px solid #5a3520;background:none;color:#fff;}
.ov-close:hover{background:#FA8072;color:#14451e;border-color:#FA8072;}
.ov-submit{font-size:12px;padding:8px 20px;border:1px solid #fff;background:#3B1F0F;color:#fff;}
.ov-submit:hover{background:#FA8072;color:#14451e;border-color:#FA8072;}
.ov-sent{display:none;font-size:12px;color:#8BC34A;margin-top:12px;}
.ov-error{font-size:11px;color:#FA8072;min-height:14px;margin-top:-12px;margin-bottom:12px;}

.msg-item{border:1px solid #5a3520;padding:10px;margin-bottom:10px;}
.msg-meta{font-size:10px;color:#8a6040;margin-bottom:4px;}
.msg-who{font-size:12px;color:#fff;margin-bottom:6px;}
.msg-branch{font-size:11px;color:#c8a882;margin-bottom:6px;font-style:italic;}
.msg-body{font-size:12px;color:#c8a882;white-space:pre-wrap;line-height:1.5;margin-bottom:8px;}
.msg-empty{font-size:12px;color:#c8a882;}
</style>
</head>
<body>

<nav id="nav">
  <span class="nav-brand">Family Archive</span>
  <div class="nav-links">
    <button class="nav-btn" onclick="showAbout()">About</button>
    <button class="nav-btn" onclick="toggleGrid()" id="grid-btn">View as grid</button>
    <button class="nav-btn" onclick="showOverlay('contact')">Contact</button>
    <button class="nav-btn" onclick="showOverlay('messages')" id="messages-btn" style="display:none;">Messages</button>
    <button class="nav-btn" onclick="handleAuthClick()" id="auth-btn">Admin</button>
  </div>
</nav>

<!-- TREE VIEW -->
<div id="toolbar">
  <button class="zoom-btn" onclick="zoom(-1)" aria-label="zoom out">−</button>
  <span id="zoom-label">100%</span>
  <button class="zoom-btn" onclick="zoom(1)" aria-label="zoom in">+</button>
  <span class="hint-txt">scroll left / right to see all branches · click any photo</span>
</div>

<div id="canvas-wrap">
  <div id="load-status">Loading family tree…</div>
  <div id="canvas" style="display:none;">
    <svg class="connectors" id="svg-lines"></svg>
    <div id="root-row">
      <div id="root-photo" onclick="openPanel('root')">👤</div>
      <div>
        <div id="root-name-label">Your Name</div>
        <div id="root-quote" onclick="editQuote()">"Add a quote or note…"</div>
      </div>
    </div>
  </div>
</div>

<!-- GRID VIEW -->
<div id="grid-view">
  <div class="grid-inner" id="grid-inner"></div>
</div>

<!-- ABOUT PAGE -->
<div id="about-page">
  <button class="about-back" onclick="hideAbout()">
    <i class="ti ti-arrow-left" aria-hidden="true"></i> Back to family tree
  </button>
  <div class="about-title">About this archive</div>
  <div class="about-body" id="about-body-text"></div>
  <textarea class="about-textarea" id="about-textarea"></textarea>
  <div style="display:flex;gap:10px;align-items:center;margin-top:8px;">
    <button class="dp-btn" id="about-edit-btn" style="display:none;" onclick="startAboutEdit()">
      <i class="ti ti-edit" aria-hidden="true"></i> Edit
    </button>
    <button class="dp-btn" id="about-save-btn" style="display:none;" onclick="saveAbout()">
      <i class="ti ti-check" aria-hidden="true"></i> Save
    </button>
  </div>
</div>

<!-- PROFILE SIDEBAR -->
<div id="detail-panel">
  <div class="dp-inner">
    <button class="back-btn" onclick="closePanel()">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Back
    </button>
    <nav id="breadcrumb-bar" aria-label="Lineage breadcrumb"></nav>
    <div id="detail-photo-wrap">👤</div>
    <div>
      <div id="detail-name"></div>
      <div id="detail-rel"></div>
    </div>
    <div>
      <div id="person-edit-fields">
        <div class="dp-label">Name</div>
        <input class="ov-input" id="edit-name" type="text">
        <div class="dp-label">Relationship</div>
        <input class="ov-input" id="edit-rel" type="text">
        <div class="dp-label">Icon (emoji, used when no photo)</div>
        <input class="ov-input" id="edit-icon" type="text" maxlength="8">
        <div class="dp-label">Photo URL (optional)</div>
        <input class="ov-input" id="edit-photo" type="text" placeholder="https://…">
        <div class="dp-label">Description</div>
      </div>
      <div id="detail-desc-text" style="font-size:13px;color:#c8a882;line-height:1.6;min-height:36px;white-space:pre-wrap;"></div>
      <textarea id="detail-edit-area" class="dp-textarea" style="display:none;margin-top:8px;" placeholder="Write about this person…"></textarea>
      <div style="display:none;margin-top:10px;" id="desc-btn-row">
        <button class="dp-btn" id="desc-edit-btn" onclick="startPersonEdit()">
          <i class="ti ti-edit" aria-hidden="true"></i> Edit
        </button>
        <button class="dp-btn" id="desc-save-btn" style="display:none;" onclick="savePerson()">
          <i class="ti ti-check" aria-hidden="true"></i> Save
        </button>
      </div>
    </div>
    <div class="dp-divider"></div>
    <div>
      <div class="dp-label">Sources &amp; citations</div>
      <div id="sources-list"></div>
      <textarea id="source-input" class="dp-textarea" style="display:none;margin-top:8px;" placeholder="Paste a source, citation, or URL…"></textarea>
      <div style="display:none;margin-top:10px;" id="src-btn-row">
        <button class="dp-btn" id="src-add-btn" onclick="startSrcAdd()">
          <i class="ti ti-plus" aria-hidden="true"></i> Add source
        </button>
        <button class="dp-btn" id="src-save-btn" style="display:none;" onclick="saveSrc()">
          <i class="ti ti-check" aria-hidden="true"></i> Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- CONTACT / QUOTE / LOGIN / MESSAGES OVERLAY -->
<div id="overlay-panel">
  <div id="overlay-bg" onclick="closeOverlay()"></div>
  <div id="overlay-box">
    <h3 id="ov-title"></h3>
    <div id="ov-content"></div>
    <div class="ov-btn-row">
      <button class="ov-close" onclick="closeOverlay()">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ════════════════════════════════════════
   SUPABASE CLIENT
   ════════════════════════════════════════ */
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ════════════════════════════════════════
   STATE — all content comes from Supabase.
   ════════════════════════════════════════ */
let people = [];          // [{id,name,rel,icon,photo_url,description,generation,sort_order}]
let connsArr = [];        // [[parentId, childId], ...]
let sourcesMap = {};       // personId -> [{id, text}]
let siteContent = { about_text:'', root_quote:'"Add a quote or note…"', feedback_intro:'', contrib_intro:'' };

let activeId    = null;
let zoomLevel   = 1;
let gridMode    = false;
let contactTab  = 'feedback';
let isAdmin     = false;

/* layout constants */
const NW = 52, NH = 72;
const RW = 160, RH = 100;
const HGAP = 100;
const ROW_Y = { 1: 180, 2: 340, 3: 500 };
const CONNECTOR_GAP = 8;

const pos = {};

/* ════════════════════════════════════════
   DATA LOADING
   ════════════════════════════════════════ */
async function loadAll() {
  const [peopleRes, connRes, srcRes, contentRes] = await Promise.all([
    supa.from('people').select('*').order('generation').order('sort_order'),
    supa.from('connections').select('*'),
    supa.from('sources').select('*').order('sort_order'),
    supa.from('site_content').select('*').eq('id', 1).single(),
  ]);

  if (peopleRes.error) throw peopleRes.error;

  people   = peopleRes.data || [];
  connsArr = (connRes.data || []).map(c => [c.parent_id, c.child_id]);

  sourcesMap = {};
  (srcRes.data || []).forEach(s => {
    if (!sourcesMap[s.person_id]) sourcesMap[s.person_id] = [];
    sourcesMap[s.person_id].push(s);
  });

  if (contentRes.data) siteContent = contentRes.data;
}

async function boot() {
  try {
    await loadAll();
    document.getElementById('load-status').style.display = 'none';
    document.getElementById('canvas').style.display = 'block';
    buildTree();
    updateVis();
  } catch (err) {
    document.getElementById('load-status').textContent =
      'Could not load the family tree. If you just set this up, make sure config.js has your real Supabase URL and anon key, and that supabase/schema.sql has been run.';
    console.error(err);
    return;
  }
  await refreshAuthState();
}

/* ════════════════════════════════════════
   AUTH
   ════════════════════════════════════════ */
async function refreshAuthState() {
  const { data: { session } } = await supa.auth.getSession();
  if (session && session.user) {
    const { data } = await supa.rpc('is_admin');
    isAdmin = !!data;
  } else {
    isAdmin = false;
  }
  updateAdminUI();
}

supa.auth.onAuthStateChange(() => { refreshAuthState(); });

function updateAdminUI() {
  document.getElementById('auth-btn').textContent = isAdmin ? 'Log out' : 'Admin';
  document.getElementById('messages-btn').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('about-edit-btn').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('desc-btn-row').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('src-btn-row').style.display = isAdmin ? 'flex' : 'none';
  const q = document.getElementById('root-quote');
  q.classList.toggle('editable', isAdmin);
}

function handleAuthClick() {
  if (isAdmin) doLogout(); else showOverlay('login');
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; return; }
  const { error } = await supa.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = 'Sign-in failed. Check your email and password.'; return; }
  closeOverlay();
  await refreshAuthState();
}

async function doLogout() {
  await supa.auth.signOut();
  await refreshAuthState();
  setView('tree');
}

/* ════════════════════════════════════════
   DOM-SAFE BUILDERS (avoid innerHTML for
   any data that came from the database)
   ════════════════════════════════════════ */
function buildAvatar(p, className) {
  const wrap = document.createElement('div');
  wrap.className = className;
  if (p.photo_url) {
    const img = document.createElement('img');
    img.src = p.photo_url;
    img.alt = p.name || '';
    wrap.appendChild(img);
  } else {
    wrap.textContent = p.icon || '👤';
  }
  return wrap;
}

/* ════════════════════════════════════════
   TREE BUILDING
   ════════════════════════════════════════ */
function generationIds(gen) {
  return people.filter(p => p.generation === gen).map(p => p.id);
}

function computePos() {
  const row1Ids = generationIds(1), row2Ids = generationIds(2), row3Ids = generationIds(3);
  const maxCols = Math.max(row1Ids.length, row2Ids.length, row3Ids.length, 1);
  const totalW  = maxCols * (NW + HGAP) + 240;
  const cx      = totalW / 2;
  pos['root'] = { x: cx, y: 20 };
  [row1Ids, row2Ids, row3Ids].forEach((ids, ri) => {
    const y = ROW_Y[ri + 1];
    ids.forEach((id, i) => {
      const startX = cx - (ids.length - 1) * (NW + HGAP) / 2;
      pos[id] = { x: startX + i * (NW + HGAP), y };
    });
  });
  return totalW;
}

function buildTree() {
  const totalW  = computePos();
  const canvas  = document.getElementById('canvas');
  const svg     = document.getElementById('svg-lines');
  const totalH  = ROW_Y[3] + NH + 100;

  document.querySelectorAll('.node').forEach(n => n.remove());
  svg.innerHTML = '';

  canvas.style.width  = totalW + 'px';
  canvas.style.height = totalH + 'px';
  svg.style.width     = totalW + 'px';
  svg.style.height    = totalH + 'px';
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

  const root = people.find(p => p.id === 'root');
  const rp = pos['root'];
  const rr = document.getElementById('root-row');
  rr.style.left = (rp.x - RW / 2 - 10) + 'px';
  rr.style.top  = rp.y + 'px';
  const rootPhotoWrap = document.getElementById('root-photo');
  rootPhotoWrap.innerHTML = '';
  if (root) {
    if (root.photo_url) {
      const img = document.createElement('img');
      img.src = root.photo_url; img.alt = root.name || '';
      rootPhotoWrap.appendChild(img);
    } else {
      rootPhotoWrap.textContent = root.icon || '👤';
    }
    document.getElementById('root-name-label').textContent = root.name;
  }
  document.getElementById('root-quote').textContent = siteContent.root_quote;

  people.filter(p => p.id !== 'root').forEach(p => {
    const pp = pos[p.id]; if (!pp) return;
    const node = document.createElement('div');
    node.className = 'node';
    node.id = 'node-' + p.id;
    node.style.left = (pp.x - NW / 2) + 'px';
    node.style.top  = pp.y + 'px';
    node.appendChild(buildAvatar(p, 'node-photo'));
    const nameEl = document.createElement('div');
    nameEl.className = 'node-name';
    nameEl.textContent = p.name;
    node.appendChild(nameEl);
    node.onclick = () => openPanel(p.id);
    canvas.appendChild(node);
  });

  connsArr.forEach(([a, b]) => {
    const pa = pos[a], pb = pos[b];
    if (!pa || !pb) return;
    let x1, y1;
    if (a === 'root') { x1 = pos['root'].x; y1 = pos['root'].y + RH + CONNECTOR_GAP; }
    else              { x1 = pa.x;          y1 = pa.y + NH + CONNECTOR_GAP; }
    const x2 = pb.x;
    const y2 = pb.y - CONNECTOR_GAP;
    const my = Math.round((y1 + y2) / 2);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', `${x1},${y1} ${x1},${my} ${x2},${my} ${x2},${y2}`);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', '#ffffff');
    line.setAttribute('stroke-width', '1.2');
    svg.appendChild(line);
  });

  buildGrid();
  document.getElementById('about-body-text').textContent = siteContent.about_text;
  document.getElementById('about-textarea').value = siteContent.about_text;
}

function buildGrid() {
  const gi = document.getElementById('grid-inner');
  gi.innerHTML = '';
  people.forEach(p => {
    const c = document.createElement('div');
    c.className = 'grid-card';
    c.appendChild(buildAvatar(p, 'grid-card-img'));
    const nameEl = document.createElement('div');
    nameEl.className = 'grid-card-name';
    nameEl.textContent = p.name;
    c.appendChild(nameEl);
    c.onclick = () => openPanel(p.id);
    gi.appendChild(c);
  });
}

/* ════════════════════════════════════════
   VIEW SWITCHING
   ════════════════════════════════════════ */
function setView(view) {
  document.getElementById('canvas-wrap').style.display  = view === 'tree'  ? 'block' : 'none';
  document.getElementById('toolbar').style.display      = view === 'tree'  ? 'flex'  : 'none';
  document.getElementById('grid-view').style.display    = view === 'grid'  ? 'block' : 'none';
  document.getElementById('about-page').style.display   = view === 'about' ? 'block' : 'none';
  gridMode = (view === 'grid');
  document.getElementById('grid-btn').textContent = gridMode ? 'View as tree' : 'View as grid';
}

function toggleGrid() { setView(gridMode ? 'tree' : 'grid'); closePanel(); }
function showAbout()  { setView('about'); closePanel(); }
function hideAbout()  { setView('tree'); }

/* ════════════════════════════════════════
   ZOOM
   ════════════════════════════════════════ */
function zoom(d) {
  zoomLevel = Math.min(2, Math.max(0.25, zoomLevel + d * 0.15));
  document.getElementById('canvas').style.transform = `scale(${zoomLevel})`;
  document.getElementById('zoom-label').textContent  = Math.round(zoomLevel * 100) + '%';
  updateVis();
}

function updateVis() {
  const sh = { 0: true, 1: zoomLevel >= 0.45, 2: zoomLevel >= 0.6, 3: zoomLevel >= 0.75 };
  people.filter(p => p.id !== 'root').forEach(p => {
    const el = document.getElementById('node-' + p.id);
    if (el) el.style.opacity = sh[p.generation] ? '1' : '0.08';
  });
}

/* ════════════════════════════════════════
   PROFILE PANEL
   ════════════════════════════════════════ */
function openPanel(id) {
  const p = people.find(x => x.id === id); if (!p) return;
  activeId = id;
  const photoWrap = document.getElementById('detail-photo-wrap');
  photoWrap.innerHTML = '';
  if (p.photo_url) {
    const img = document.createElement('img'); img.src = p.photo_url; img.alt = p.name || '';
    photoWrap.appendChild(img);
  } else {
    photoWrap.textContent = p.icon || '👤';
  }
  document.getElementById('detail-name').textContent = p.name;
  document.getElementById('detail-rel').textContent  = p.rel;
  document.getElementById('detail-desc-text').textContent = p.description || 'No description yet.';
  exitPersonEdit();
  document.getElementById('source-input').style.display  = 'none';
  document.getElementById('src-save-btn').style.display  = 'none';
  document.getElementById('src-add-btn').style.display   = 'inline-block';
  renderSrcs(id);
  renderBreadcrumb(id);
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  const bar = document.getElementById('breadcrumb-bar');
  bar.innerHTML = '';
  bar.classList.remove('visible');
  activeId = null;
}

function startPersonEdit() {
  if (!isAdmin || !activeId) return;
  const p = people.find(x => x.id === activeId); if (!p) return;
  document.getElementById('edit-name').value  = p.name || '';
  document.getElementById('edit-rel').value   = p.rel || '';
  document.getElementById('edit-icon').value  = p.icon || '';
  document.getElementById('edit-photo').value = p.photo_url || '';
  document.getElementById('detail-edit-area').value = p.description || '';
  document.getElementById('person-edit-fields').style.display = 'flex';
  document.getElementById('detail-edit-area').style.display = 'block';
  document.getElementById('detail-desc-text').style.display = 'none';
  document.getElementById('desc-save-btn').style.display = 'inline-block';
  document.getElementById('desc-edit-btn').style.display = 'none';
}

function exitPersonEdit() {
  document.getElementById('person-edit-fields').style.display = 'none';
  document.getElementById('detail-edit-area').style.display = 'none';
  document.getElementById('detail-desc-text').style.display = 'block';
  document.getElementById('desc-save-btn').style.display = 'none';
  document.getElementById('desc-edit-btn').style.display = 'inline-block';
}

async function savePerson() {
  if (!activeId || !isAdmin) return;
  const updates = {
    name: document.getElementById('edit-name').value.trim() || 'Unnamed',
    rel: document.getElementById('edit-rel').value.trim(),
    icon: document.getElementById('edit-icon').value.trim() || '👤',
    photo_url: document.getElementById('edit-photo').value.trim() || null,
    description: document.getElementById('detail-edit-area').value.trim(),
  };
  const { error } = await supa.from('people').update(updates).eq('id', activeId);
  if (error) { alert('Save failed — you may need to sign in again as admin.'); return; }
  Object.assign(people.find(x => x.id === activeId), updates);
  buildTree();
  updateVis();
  openPanel(activeId);
}

/* ════════════════════════════════════════
   SOURCES
   ════════════════════════════════════════ */
function startSrcAdd() {
  document.getElementById('source-input').style.display  = 'block';
  document.getElementById('src-save-btn').style.display  = 'inline-block';
  document.getElementById('src-add-btn').style.display   = 'none';
  document.getElementById('source-input').focus();
}

async function saveSrc() {
  if (!activeId) return;
  const v = document.getElementById('source-input').value.trim(); if (!v) return;
  const nextOrder = (sourcesMap[activeId] || []).length;
  const { data, error } = await supa.from('sources')
    .insert({ person_id: activeId, text: v, sort_order: nextOrder })
    .select().single();
  if (error) { alert('Could not add source — you may need to sign in again as admin.'); return; }
  if (!sourcesMap[activeId]) sourcesMap[activeId] = [];
  sourcesMap[activeId].push(data);
  document.getElementById('source-input').value = '';
  document.getElementById('source-input').style.display = 'none';
  document.getElementById('src-save-btn').style.display  = 'none';
  document.getElementById('src-add-btn').style.display   = 'inline-block';
  renderSrcs(activeId);
}

async function delSrc(srcId) {
  const { error } = await supa.from('sources').delete().eq('id', srcId);
  if (error) { alert('Could not delete source.'); return; }
  sourcesMap[activeId] = (sourcesMap[activeId] || []).filter(s => s.id !== srcId);
  renderSrcs(activeId);
}

function renderSrcs(id) {
  const list = document.getElementById('sources-list');
  list.innerHTML = '';
  (sourcesMap[id] || []).forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'src-item';
    const num = document.createElement('span'); num.className = 'src-num'; num.textContent = `[${i + 1}]`;
    const txt = document.createElement('span'); txt.style.flex = '1'; txt.textContent = s.text;
    row.appendChild(num); row.appendChild(txt);
    if (isAdmin) {
      const del = document.createElement('button');
      del.className = 'src-del'; del.textContent = '×';
      del.onclick = () => delSrc(s.id);
      row.appendChild(del);
    }
    list.appendChild(row);
  });
}

/* ════════════════════════════════════════
   OVERLAY (CONTACT / QUOTE / LOGIN / MESSAGES)
   ════════════════════════════════════════ */
function editQuote() { if (isAdmin) showOverlay('quote'); }

async function saveQuote() {
  const v = document.getElementById('quote-input').value.trim();
  const q = v ? `"${v}"` : '"Add a quote or note…"';
  const { error } = await supa.from('site_content').update({ root_quote: q }).eq('id', 1);
  if (error) { alert('Save failed.'); return; }
  siteContent.root_quote = q;
  document.getElementById('root-quote').textContent = q;
  closeOverlay();
}

async function showOverlay(type) {
  const titles = { contact: 'Contact', quote: 'Edit quote', login: 'Admin sign in', messages: 'Messages' };
  document.getElementById('ov-title').textContent = titles[type] || '';
  const content = document.getElementById('ov-content');
  content.innerHTML = '';

  if (type === 'quote') {
    const field = document.createElement('div'); field.className = 'ov-field';
    const label = document.createElement('label'); label.textContent = 'Quote or note';
    const input = document.createElement('input'); input.className = 'ov-input'; input.id = 'quote-input'; input.type = 'text';
    input.value = siteContent.root_quote.replace(/^"|"$/g, '');
    field.appendChild(label); field.appendChild(input);
    const row = document.createElement('div'); row.className = 'ov-btn-row';
    const btn = document.createElement('button'); btn.className = 'ov-submit'; btn.textContent = 'Save'; btn.onclick = saveQuote;
    row.appendChild(btn);
    content.appendChild(field); content.appendChild(row);
  } else if (type === 'login') {
    content.appendChild(buildLoginForm());
  } else if (type === 'contact') {
    content.appendChild(buildContact());
  } else if (type === 'messages') {
    const loading = document.createElement('div'); loading.className = 'msg-empty'; loading.textContent = 'Loading…';
    content.appendChild(loading);
    document.getElementById('overlay-panel').classList.add('open');
    content.innerHTML = '';
    content.appendChild(await buildMessagesPanel());
    return;
  }
  document.getElementById('overlay-panel').classList.add('open');
}

function buildLoginForm() {
  const wrap = document.createElement('div');

  const emailField = document.createElement('div'); emailField.className = 'ov-field';
  const emailLabel = document.createElement('label'); emailLabel.textContent = 'Email';
  const emailInput = document.createElement('input'); emailInput.className = 'ov-input'; emailInput.id = 'login-email'; emailInput.type = 'email';
  emailField.appendChild(emailLabel); emailField.appendChild(emailInput);

  const pwField = document.createElement('div'); pwField.className = 'ov-field';
  const pwLabel = document.createElement('label'); pwLabel.textContent = 'Password';
  const pwInput = document.createElement('input'); pwInput.className = 'ov-input'; pwInput.id = 'login-password'; pwInput.type = 'password';
  pwInput.onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
  pwField.appendChild(pwLabel); pwField.appendChild(pwInput);

  const err = document.createElement('div'); err.className = 'ov-error'; err.id = 'login-error';

  const row = document.createElement('div'); row.className = 'ov-btn-row';
  const btn = document.createElement('button'); btn.className = 'ov-submit'; btn.textContent = 'Sign in'; btn.onclick = doLogin;
  row.appendChild(btn);

  wrap.appendChild(emailField); wrap.appendChild(pwField); wrap.appendChild(err); wrap.appendChild(row);
  return wrap;
}

function buildIntroBlock(kind, introText) {
  const wrap = document.createElement('div'); wrap.style.marginBottom = '16px';
  const textEl = document.createElement('div'); textEl.className = 'desc-text-block'; textEl.id = kind + '-intro-text'; textEl.textContent = introText;
  const editArea = document.createElement('textarea'); editArea.className = 'dp-textarea'; editArea.id = kind + '-intro-edit';
  editArea.style.display = 'none'; editArea.style.marginTop = '6px'; editArea.placeholder = 'Edit this description…';
  const btnRow = document.createElement('div'); btnRow.style.display = isAdmin ? 'flex' : 'none'; btnRow.style.gap = '8px'; btnRow.style.marginTop = '6px';
  const editBtn = document.createElement('button'); editBtn.className = 'desc-edit-inline-btn'; editBtn.id = kind + '-intro-edit-btn'; editBtn.textContent = 'Edit description';
  editBtn.onclick = () => startIntroEdit(kind);
  const saveBtn = document.createElement('button'); saveBtn.className = 'desc-edit-inline-btn'; saveBtn.id = kind + '-intro-save-btn'; saveBtn.style.display = 'none'; saveBtn.textContent = 'Save';
  saveBtn.onclick = () => saveIntroEdit(kind);
  btnRow.appendChild(editBtn); btnRow.appendChild(saveBtn);
  wrap.appendChild(textEl); wrap.appendChild(editArea); wrap.appendChild(btnRow);
  return wrap;
}

function buildFormFields(kind, fields) {
  const frag = document.createDocumentFragment();
  fields.forEach(f => {
    const field = document.createElement('div'); field.className = 'ov-field';
    const label = document.createElement('label'); label.textContent = f.label;
    const input = document.createElement(f.textarea ? 'textarea' : 'input');
    input.className = f.textarea ? 'ov-textarea' : 'ov-input';
    input.id = kind + '-' + f.id;
    if (!f.textarea) input.type = f.type || 'text';
    field.appendChild(label); field.appendChild(input);
    frag.appendChild(field);
  });
  return frag;
}

function buildContact() {
  const wrap = document.createElement('div');

  const tabs = document.createElement('div'); tabs.className = 'ov-tabs';
  const fbTab = document.createElement('button'); fbTab.className = 'ov-tab' + (contactTab === 'feedback' ? ' active' : ''); fbTab.textContent = 'Give feedback';
  fbTab.onclick = () => setTab('feedback');
  const ctTab = document.createElement('button'); ctTab.className = 'ov-tab' + (contactTab === 'contrib' ? ' active' : ''); ctTab.textContent = 'Submit a contribution';
  ctTab.onclick = () => setTab('contrib');
  tabs.appendChild(fbTab); tabs.appendChild(ctTab);
  wrap.appendChild(tabs);

  if (contactTab === 'feedback') {
    wrap.appendChild(buildIntroBlock('fb', siteContent.feedback_intro));
    wrap.appendChild(buildFormFields('fb', [
      { id: 'name', label: 'Your name' },
      { id: 'email', label: 'Your email', type: 'email' },
      { id: 'msg', label: 'Email body', textarea: true },
    ]));
    const row = document.createElement('div'); row.className = 'ov-btn-row';
    const btn = document.createElement('button'); btn.className = 'ov-submit'; btn.textContent = 'Send feedback'; btn.onclick = () => sendForm('fb');
    row.appendChild(btn); wrap.appendChild(row);
    const sent = document.createElement('div'); sent.className = 'ov-sent'; sent.id = 'fb-sent'; sent.textContent = 'Sent! Thank you for your feedback.';
    wrap.appendChild(sent);
  } else {
    wrap.appendChild(buildIntroBlock('ct', siteContent.contrib_intro));
    wrap.appendChild(buildFormFields('ct', [
      { id: 'name', label: 'Your name' },
      { id: 'email', label: 'Your email', type: 'email' },
      { id: 'branch', label: 'Name of submission' },
      { id: 'msg', label: 'Email body', textarea: true },
    ]));
    const row = document.createElement('div'); row.className = 'ov-btn-row';
    const btn = document.createElement('button'); btn.className = 'ov-submit'; btn.textContent = 'Submit contribution'; btn.onclick = () => sendForm('ct');
    row.appendChild(btn); wrap.appendChild(row);
    const sent = document.createElement('div'); sent.className = 'ov-sent'; sent.id = 'ct-sent'; sent.textContent = "Submitted! We'll be in touch.";
    wrap.appendChild(sent);
  }
  return wrap;
}

function setTab(t) {
  contactTab = t;
  const content = document.getElementById('ov-content');
  content.innerHTML = '';
  content.appendChild(buildContact());
}

function startIntroEdit(kind) {
  if (!isAdmin) return;
  document.getElementById(kind + '-intro-text').style.display = 'none';
  const editArea = document.getElementById(kind + '-intro-edit');
  editArea.style.display = 'block';
  editArea.value = kind === 'fb' ? siteContent.feedback_intro : siteContent.contrib_intro;
  document.getElementById(kind + '-intro-edit-btn').style.display = 'none';
  document.getElementById(kind + '-intro-save-btn').style.display = 'inline-block';
}

async function saveIntroEdit(kind) {
  const v = document.getElementById(kind + '-intro-edit').value.trim();
  const field = kind === 'fb' ? 'feedback_intro' : 'contrib_intro';
  const { error } = await supa.from('site_content').update({ [field]: v }).eq('id', 1);
  if (error) { alert('Save failed.'); return; }
  siteContent[field] = v;
  document.getElementById(kind + '-intro-text').textContent = v;
  document.getElementById(kind + '-intro-text').style.display = 'block';
  document.getElementById(kind + '-intro-edit').style.display = 'none';
  document.getElementById(kind + '-intro-edit-btn').style.display = 'inline-block';
  document.getElementById(kind + '-intro-save-btn').style.display = 'none';
}

async function sendForm(kind) {
  const body = document.getElementById(kind + '-msg').value.trim();
  const sentEl = document.getElementById(kind + '-sent');
  if (!body) return;
  const payload = {
    type: kind === 'fb' ? 'feedback' : 'contribution',
    name: document.getElementById(kind + '-name').value.trim() || null,
    email: document.getElementById(kind + '-email').value.trim() || null,
    branch_name: kind === 'ct' ? (document.getElementById('ct-branch').value.trim() || null) : null,
    body,
  };
  const { error } = await supa.from('messages').insert(payload);
  if (error) {
    if (sentEl) { sentEl.style.color = '#FA8072'; sentEl.textContent = 'Something went wrong — please try again later.'; sentEl.style.display = 'block'; }
    return;
  }
  if (sentEl) sentEl.style.display = 'block';
}

async function buildMessagesPanel() {
  const wrap = document.createElement('div');
  const { data, error } = await supa.from('messages').select('*').order('created_at', { ascending: false });
  if (error) { wrap.className = 'msg-empty'; wrap.textContent = 'Could not load messages.'; return wrap; }
  if (!data || data.length === 0) { wrap.className = 'msg-empty'; wrap.textContent = 'No messages yet.'; return wrap; }

  data.forEach(m => {
    const item = document.createElement('div'); item.className = 'msg-item';
    const meta = document.createElement('div'); meta.className = 'msg-meta';
    meta.textContent = `${m.type === 'feedback' ? 'Feedback' : 'Contribution'} · ${new Date(m.created_at).toLocaleString()}`;
    const who = document.createElement('div'); who.className = 'msg-who';
    who.textContent = [m.name, m.email].filter(Boolean).join(' · ') || 'Anonymous';
    item.appendChild(meta); item.appendChild(who);
    if (m.branch_name) {
      const b = document.createElement('div'); b.className = 'msg-branch'; b.textContent = 'Submission: ' + m.branch_name;
      item.appendChild(b);
    }
    const body = document.createElement('div'); body.className = 'msg-body'; body.textContent = m.body;
    item.appendChild(body);
    const del = document.createElement('button'); del.className = 'ov-close'; del.textContent = 'Delete';
    del.onclick = async () => { await supa.from('messages').delete().eq('id', m.id); showOverlay('messages'); };
    item.appendChild(del);
    wrap.appendChild(item);
  });
  return wrap;
}

function closeOverlay() {
  document.getElementById('overlay-panel').classList.remove('open');
}

/* ════════════════════════════════════════
   BREADCRUMB
   ════════════════════════════════════════ */
function buildParentMap() {
  const map = {};
  connsArr.forEach(([parent, child]) => {
    if (!map[child]) map[child] = [];
    map[child].push(parent);
  });
  return map;
}

function getLineage(id) {
  const parentMap = buildParentMap();
  function climb(current, path) {
    const parents = parentMap[current];
    if (!parents || parents.length === 0) return [current, ...path];
    return climb(parents[0], [current, ...path]);
  }
  return climb(id, []);
}

function renderBreadcrumb(id) {
  const bar = document.getElementById('breadcrumb-bar');
  const lineage = getLineage(id);
  bar.innerHTML = '';

  if (lineage.length <= 1) { bar.classList.remove('visible'); return; }

  bar.classList.add('visible');
  lineage.forEach((pid, idx) => {
    const person = people.find(p => p.id === pid);
    const name = person ? person.name : pid;
    const isLast = idx === lineage.length - 1;
    const item = document.createElement('span'); item.className = 'bc-item';
    if (isLast) {
      const cur = document.createElement('span'); cur.className = 'bc-current'; cur.textContent = name;
      item.appendChild(cur);
    } else {
      const link = document.createElement('button'); link.className = 'bc-link'; link.textContent = name; link.title = 'Go to ' + name;
      link.onclick = () => openPanel(pid);
      item.appendChild(link);
      const sep = document.createElement('span'); sep.className = 'bc-sep'; sep.textContent = '›';
      item.appendChild(sep);
    }
    bar.appendChild(item);
  });
}
